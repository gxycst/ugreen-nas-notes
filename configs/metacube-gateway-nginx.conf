server {
    listen 18080;
    server_name _;

    # Mihomo REST API and WebSocket endpoints. The trailing slash strips
    # the public /mihomo/ prefix before forwarding to the API.
    location ^~ /mihomo/ {
        proxy_pass http://127.0.0.1:36815/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Prevent an old service worker from keeping a stale PWA shell.
    location = /sw.js {
        proxy_pass http://127.0.0.1:42099/sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Expires "0" always;
    }

    # MetaCubeXD application. Hashed static assets may retain upstream caching.
    location / {
        proxy_pass http://127.0.0.1:42099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

